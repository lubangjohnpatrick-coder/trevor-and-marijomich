<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trevor &amp; Marijomich</title>
<link rel="canonical" href="/">
<meta http-equiv="refresh" content="0; url=./">
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: grid;
    place-items: center;
    background: #2f3a26;
    color: #eef0e6;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  p { font-size: 15px; letter-spacing: .04em; opacity: .8; }
  a { color: #eef0e6; }
</style>
</head>
<body>
<p>Taking you to the invitation&hellip;</p>
<script>
  /* GitHub Pages has no URL rewrites, so a personal link such as
     /trevorandmich.online/charleslawrencegozo is served this 404 page
     instead of the site. The last path segment is the guest's token, so it
     is forwarded to the real page as ?token=<slug> rather than discarded.

     The site folder (everything before the final segment) is kept, because a
     relative "./" would resolve against the missing directory and land here
     again, looping forever. */
  (function () {
    var path = window.location.pathname;

    /* /invite/<token> is the long form that admin.html prints. */
    var long = path.match(/^(.*)\/invite\/([^/]+)\/?$/);
    if (long) {
      window.location.replace(long[1] + '/?token=' + encodeURIComponent(long[2]));
      return;
    }

    /* Anything else is a bare guest slug: /<token>. */
    var bare = path.match(/^(.*)\/([^/]+)\/?$/);
    if (bare && bare[2] && !/\.(?:html?|png|jpe?g|svg|webp|mp3|woff2?|css|js)$/i.test(bare[2])) {
      window.location.replace(bare[1] + '/?token=' + encodeURIComponent(bare[2]));
      return;
    }

    /* A real missing file, or the bare site root: just go to the home page. */
    window.location.replace(path.replace(/[^/]*$/, '') || '/');
  }());
</script>
</body>
</html>
