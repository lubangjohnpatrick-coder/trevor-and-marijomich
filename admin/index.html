<p>Opening the admin page&hellip;</p>
<script>
  /* This file only exists so the admin page can be reached at a clean
     /admin instead of /admin.html.

     GitHub Pages has no URL rewrites, but it does serve admin/index.html
     for the path /admin, so a plain redirect is enough. The real page
     stays one level up at /admin.html, which keeps all its relative
     paths (styles.css, js/config.js, js/store.js) working. */
  (function () {
    window.location.replace('../admin.html');
  }());
</script>
